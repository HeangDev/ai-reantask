server:
  port: 8080

app:
  security:
    jwt:
      secret: ${JWT_SECRET:af60742270c09f3a9ba6706cd71c3531}            # no default: startup fails if missing. >= 32 chars (openssl rand -base64 48)
      issuer: ${JWT_ISSUER:reantask-api}
      access-token-ttl: 15m
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    google:
      client-id: ${GOOGLE_CLIENT_ID:274379845668-3406s9aucfumtecdbe4apo80lgfcotsp.apps.googleusercontent.com}
  seed:
    admin:   # dev defaults: override with env vars outside local development
      fullname: ${SEED_ADMIN_FULLNAME:Sim Kimheang}
      email: ${SEED_ADMIN_EMAIL:simkimheang4@gmail.com}
      phone: ${SEED_ADMIN_PHONE:+85511263262}
      password: ${SEED_ADMIN_PASSWORD:password}
      scope:
        - openid
        - email
        - profile

spring:
  application:
    name: api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:54311/db_reantask}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: 15
      connection-timeout: 30000
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
